<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    .kanban-board { display: flex; gap: 1.25rem; height: calc(100vh - 6rem); padding: 1.5rem; overflow-x: auto; align-items: flex-start; }
    .kanban-column { flex: 1; min-width: 320px; max-width: 400px; background: var(--card); border: 1px solid var(--border); border-radius: 0.75rem; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,0.05); max-height: 100%; }
    .kanban-column-header { padding: 1rem; font-weight: 600; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.02); }
    
    .kanban-cards { flex: 1; padding: 1rem; overflow-y: auto; display: flex; flex-direction: column; gap: 0.75rem; min-height: 200px; }
    
    .kanban-card { 
      background: var(--background); 
      border: 1px solid var(--border); 
      border-radius: 0.5rem; 
      padding: 1rem; 
      cursor: grab; 
      transition: box-shadow 0.2s, transform 0.2s, border-color 0.2s;
      position: relative;
    }
    .kanban-card:hover { box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); border-color: #9ca3af; }
    .kanban-card:active { cursor: grabbing; }
    .kanban-card.dragging { opacity: 0.4; }
    
    .kanban-card.is-priority {
      border-left: 4px solid rgb(239, 68, 68);
    }
    
    .tag { display: inline-block; padding: 0.25rem 0.6rem; border-radius: 9999px; font-size: 0.7rem; font-weight: 700; margin-bottom: 0.5rem; margin-right: 0.25rem; text-transform: uppercase; letter-spacing: 0.05em; }
    
    /* Project Tags */
    .tag-indep { background-color: rgba(59, 130, 246, 0.15); color: rgb(37, 99, 235); }
    .tag-lord { background-color: rgba(16, 185, 129, 0.15); color: rgb(5, 150, 105); }
    .tag-paget { background-color: rgba(139, 92, 246, 0.15); color: rgb(109, 40, 217); }
    .tag-transv { background-color: rgba(245, 158, 11, 0.15); color: rgb(217, 119, 6); }
    .tag-custom { background-color: rgba(107, 114, 128, 0.15); color: rgb(75, 85, 99); }
    
    /* Priority Tag */
    .tag-priority { background-color: rgba(239, 68, 68, 0.15); color: rgb(220, 38, 38); display: inline-flex; align-items: center; gap: 0.25rem; }
    
    .delete-btn { display: none; position: absolute; top: 0.5rem; right: 0.5rem; color: var(--muted-foreground); cursor: pointer; padding: 0.25rem; }
    .kanban-card:hover .delete-btn { display: block; }
    .delete-btn:hover { color: rgb(239, 68, 68); }

    /* Modal styles */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 50; justify-content: center; align-items: center; }
    .modal-overlay.active { display: flex; }
    .modal-content { background: var(--card); padding: 1.5rem; border-radius: 0.75rem; width: 100%; max-width: 400px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
  </style>
</head>
<body class="bg-[var(--background)] text-[var(--foreground)] antialiased h-screen overflow-hidden flex flex-col m-0 font-sans">
  
  <header class="p-4 border-b border-[var(--border)] bg-[var(--card)] flex justify-between items-center shadow-sm z-10 shrink-0">
    <div>
      <h1 class="text-xl font-bold tracking-tight">Programa de Trabajo - Comercial</h1>
      <p class="text-sm text-[var(--muted-foreground)]">Arrastra las tarjetas, crea nuevas o marca las prioritarias.</p>
    </div>
    <div class="flex gap-2">
      <button onclick="exportData()" class="text-sm border border-[var(--border)] hover:bg-[var(--accent)] px-3 py-2 rounded-md font-medium transition-colors" title="Descargar datos">
        💾 Exportar
      </button>
      <button onclick="document.getElementById('importFile').click()" class="text-sm border border-[var(--border)] hover:bg-[var(--accent)] px-3 py-2 rounded-md font-medium transition-colors" title="Subir datos">
        📂 Importar
      </button>
      <input type="file" id="importFile" style="display:none" accept=".json" onchange="importData(event)">
      <button onclick="openAddModal()" class="text-sm bg-blue-600 text-white hover:bg-blue-700 px-4 py-2 rounded-md font-medium transition-colors shadow-sm">
        + Nueva Tarea
      </button>
      <button onclick="resetBoard()" class="text-sm border border-[var(--border)] hover:bg-red-50 hover:text-red-600 px-4 py-2 rounded-md font-medium transition-colors">
        Restablecer
      </button>
    </div>
  </header>
  
  <main class="kanban-board">
    <div class="kanban-column">
      <div class="kanban-column-header">
         <span>📝 Por Hacer</span>
         <span class="bg-[var(--border)] px-2 py-0.5 rounded-full text-xs" id="count-todo">0</span>
      </div>
      <div class="kanban-cards dropzone" id="todo"></div>
    </div>
    
    <div class="kanban-column">
      <div class="kanban-column-header">
         <span>⏳ En Progreso</span>
         <span class="bg-[var(--border)] px-2 py-0.5 rounded-full text-xs" id="count-in-progress">0</span>
      </div>
      <div class="kanban-cards dropzone" id="in-progress"></div>
    </div>
    
    <div class="kanban-column">
      <div class="kanban-column-header">
         <span>✅ Terminado</span>
         <span class="bg-[var(--border)] px-2 py-0.5 rounded-full text-xs" id="count-done">0</span>
      </div>
      <div class="kanban-cards dropzone" id="done-col"></div>
    </div>
  </main>

  <!-- Add Task Modal -->
  <div id="addModal" class="modal-overlay">
    <div class="modal-content">
      <h2 class="text-lg font-bold mb-4">Añadir Nueva Tarea</h2>
      <div class="flex flex-col gap-3">
        <div>
          <label class="block text-sm font-medium mb-1">Proyecto</label>
          <select id="newTaskProject" class="w-full border border-[var(--border)] bg-[var(--background)] rounded-md p-2 text-sm focus:outline-none focus:border-blue-500">
            <option value="Independencia & Teruel" data-class="tag-indep">Independencia & Teruel</option>
            <option value="Lord Cochrane 4" data-class="tag-lord">Lord Cochrane 4</option>
            <option value="Paget 01 y 02" data-class="tag-paget">Paget 01 y 02</option>
            <option value="Apoyo Transversal" data-class="tag-transv">Apoyo Comercial Transversal</option>
            <option value="Otro" data-class="tag-custom">Otro Proyecto</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Título</label>
          <input type="text" id="newTaskTitle" placeholder="Ej: Renders de cocina" class="w-full border border-[var(--border)] bg-[var(--background)] rounded-md p-2 text-sm focus:outline-none focus:border-blue-500">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Descripción</label>
          <textarea id="newTaskDesc" rows="3" placeholder="Detalles de la tarea..." class="w-full border border-[var(--border)] bg-[var(--background)] rounded-md p-2 text-sm focus:outline-none focus:border-blue-500 resize-none"></textarea>
        </div>
        <div class="flex items-center gap-2 mt-1">
          <input type="checkbox" id="newTaskPriority" class="w-4 h-4 rounded text-blue-600 focus:ring-blue-500">
          <label for="newTaskPriority" class="text-sm font-medium text-red-600 flex items-center gap-1">🔥 Marcar como Prioritario</label>
        </div>
      </div>
      <div class="flex justify-end gap-2 mt-5">
        <button onclick="closeModal()" class="px-4 py-2 text-sm border border-[var(--border)] rounded-md hover:bg-[var(--accent)]">Cancelar</button>
        <button onclick="addTask()" class="px-4 py-2 text-sm bg-blue-600 text-white rounded-md hover:bg-blue-700">Guardar Tarea</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://cegnqgqftdiramaoebsy.supabase.co/rest/v1/tasks';
    const SUPABASE_KEY = 'sb_publishable_oOBGRvcqeH1QxFnG7zIY0g_A_eNAk6u';
    
    const HEADERS = {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY,
      'Content-Type': 'application/json',
      'Prefer': 'return=representation'
    };

    const initialData = [
      { id: 't3', col_id: 'todo', project: 'Independencia & Teruel', tag_class: 'tag-indep', title: 'Renders del lobby', description: 'Desarrollar los renders interiores del lobby una vez cerrados los criterios de diseño.', priority: false },
      { id: 't4', col_id: 'todo', project: 'Independencia & Teruel', tag_class: 'tag-indep', title: 'Renders del área común', description: 'Definir configuración con CC17. Una vez aprobada, desarrollar renders.', priority: false },
      { id: 't6', col_id: 'todo', project: 'Lord Cochrane 4', tag_class: 'tag-lord', title: 'Renders de departamentos', description: 'Iniciar renders interiores de tipologías 1, 2 y 3. Especial prioridad a la tipología 3.', priority: true },
      { id: 't7', col_id: 'todo', project: 'Lord Cochrane 4', tag_class: 'tag-lord', title: 'Tour virtual del PH 802', description: 'Recorrido virtual para entender distribución y relación entre interiores, terrazas y exteriores.', priority: false },
      { id: 't8', col_id: 'todo', project: 'Lord Cochrane 4', tag_class: 'tag-lord', title: 'Renders del lobby', description: 'Desarrollar sobre la base del diseño final aprobado.', priority: false },
      { id: 't9', col_id: 'todo', project: 'Lord Cochrane 4', tag_class: 'tag-lord', title: 'Renders del área común', description: 'Comunicar concepto y uso del espacio común (una vez definido diseño).', priority: false },
      { id: 't11', col_id: 'todo', project: 'Paget 01 y 02', tag_class: 'tag-paget', title: 'Afinación de renders exteriores', description: 'Revisión y ajuste. Coordinación constante con paisajismo y arquitectura.', priority: false },
      { id: 't12', col_id: 'todo', project: 'Paget 01 y 02', tag_class: 'tag-paget', title: 'Paget 01: Actualización renders interiores', description: 'Definir alcance. Evaluar qué imágenes necesitan actualizarse para la etapa final de ventas.', priority: false },
      { id: 't13', col_id: 'todo', project: 'Apoyo Transversal', tag_class: 'tag-transv', title: 'Mockups y piezas de apoyo', description: 'Apoyar en desarrollo de mockups. Adaptar renders y planos para piezas impresas y sala de ventas.', priority: false },
      { id: 't1', col_id: 'in-progress', project: 'Independencia & Teruel', tag_class: 'tag-indep', title: 'Tour virtual de departamentos', description: 'Continuar desarrollo. Evaluar priorizar tipologías 3, 4 y 5.', priority: true },
      { id: 't2', col_id: 'in-progress', project: 'Independencia & Teruel', tag_class: 'tag-indep', title: 'Interiorismo para tour virtual', description: 'Alinear propuesta con identidad. Pendiente coordinar reunión con interioristas.', priority: false },
      { id: 't5', col_id: 'in-progress', project: 'Independencia & Teruel', tag_class: 'tag-indep', title: 'Planos comerciales', description: 'Continuar con desarrollo y actualización según necesidades comerciales.', priority: false },
      { id: 't10', col_id: 'in-progress', project: 'Lord Cochrane 4', tag_class: 'tag-lord', title: 'Planos comerciales', description: 'Continuar desarrollo y actualización, incorporando ajustes para ventas.', priority: false }
    ];

    let tasksData = [];

    async function loadTasks() {
      try {
        const res = await fetch(SUPABASE_URL, { headers: HEADERS });
        if (!res.ok) throw new Error('Error de permisos o red');
        tasksData = await res.json();
        
        // Si la BD está vacía, la llenamos con initialData
        if (tasksData.length === 0) {
          for (let task of initialData) {
            await fetch(SUPABASE_URL, {
              method: 'POST',
              headers: HEADERS,
              body: JSON.stringify(task)
            });
          }
          tasksData = initialData;
        }
        
        renderBoard();
      } catch (e) {
        console.error(e);
        alert("Falta darle permisos a la base de datos. Asegúrate de correr el código SQL de seguridad.");
      }
    }

    function renderBoard() {
      ['todo', 'in-progress', 'done-col'].forEach(colId => {
        const col = document.getElementById(colId);
        col.innerHTML = '';
        
        const colTasks = tasksData.filter(t => t.col_id === colId);
        
        colTasks.forEach(task => {
          const card = document.createElement('div');
          card.className = `kanban-card text-sm ${task.priority ? 'is-priority' : ''}`;
          card.draggable = true;
          card.id = task.id;
          
          let tagsHtml = `<span class="tag ${task.tag_class}">${task.project}</span>`;
          if (task.priority) {
            tagsHtml += `<span class="tag tag-priority">🔥 Prioritario</span>`;
          }
          
          card.innerHTML = `
            <button class="delete-btn" onclick="deleteTask('${task.id}')" title="Eliminar tarea">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            </button>
            <div class="mb-3">${tagsHtml}</div>
            <div class="font-bold text-base mb-1.5 text-[var(--foreground)] pr-6">${task.title}</div>
            <div class="text-[var(--muted-foreground)] leading-relaxed">${task.description}</div>
          `;
          
          card.addEventListener('dragstart', handleDragStart);
          card.addEventListener('dragend', handleDragEnd);
          col.appendChild(card);
        });
        
        document.getElementById(`count-${colId}`).innerText = colTasks.length;
      });
    }

    async function addTask() {
      const title = document.getElementById('newTaskTitle').value.trim();
      const desc = document.getElementById('newTaskDesc').value.trim();
      const priority = document.getElementById('newTaskPriority').checked;
      const select = document.getElementById('newTaskProject');
      const project = select.options[select.selectedIndex].value;
      const tagClass = select.options[select.selectedIndex].getAttribute('data-class');

      if (!title) return alert("El título es obligatorio.");

      const newTask = {
        id: 't' + Date.now(),
        col_id: 'todo',
        project: project,
        tag_class: tagClass,
        title: title,
        description: desc,
        priority: priority
      };

      try {
        await fetch(SUPABASE_URL, {
          method: 'POST',
          headers: HEADERS,
          body: JSON.stringify(newTask)
        });
        tasksData.push(newTask);
        renderBoard();
        closeModal();
      } catch (e) {
        alert("Error al guardar.");
      }
    }

    async function deleteTask(id) {
      if(!confirm("¿Estás seguro de eliminar esta tarea?")) return;
      try {
        await fetch(`${SUPABASE_URL}?id=eq.${id}`, { method: 'DELETE', headers: HEADERS });
        tasksData = tasksData.filter(t => t.id !== id);
        renderBoard();
      } catch (e) {
        alert("Error al borrar.");
      }
    }

    // Modal Logic
    function openAddModal() { document.getElementById('addModal').classList.add('active'); document.getElementById('newTaskTitle').focus(); }
    function closeModal() {
      document.getElementById('addModal').classList.remove('active');
      document.getElementById('newTaskTitle').value = '';
      document.getElementById('newTaskDesc').value = '';
      document.getElementById('newTaskPriority').checked = false;
    }

    // Drag and Drop Logic
    let draggedCard = null;

    function handleDragStart(e) {
      draggedCard = this;
      setTimeout(() => this.classList.add('dragging'), 0);
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', this.id);
    }

    async function handleDragEnd(e) {
      this.classList.remove('dragging');
      const newColId = this.parentElement.id;
      const id = this.id;
      
      const task = tasksData.find(t => t.id === id);
      if (task && task.col_id !== newColId) {
        task.col_id = newColId;
        renderBoard(); // update UI instantly
        try {
          await fetch(`${SUPABASE_URL}?id=eq.${id}`, {
            method: 'PATCH',
            headers: HEADERS,
            body: JSON.stringify({ col_id: newColId })
          });
        } catch (e) {
          console.error("No se pudo guardar la posición en el servidor");
        }
      }
      draggedCard = null;
    }

    document.querySelectorAll('.dropzone').forEach(zone => {
      zone.addEventListener('dragover', e => {
        e.preventDefault();
        const afterElement = getDragAfterElement(zone, e.clientY);
        if (draggedCard) {
          if (afterElement == null) {
            zone.appendChild(draggedCard);
          } else {
            zone.insertBefore(draggedCard, afterElement);
          }
        }
      });
    });

    function getDragAfterElement(container, y) {
      const draggableElements = [...container.querySelectorAll('.kanban-card:not(.dragging)')];
      return draggableElements.reduce((closest, child) => {
        const box = child.getBoundingClientRect();
        const offset = y - box.top - box.height / 2;
        if (offset < 0 && offset > closest.offset) {
          return { offset: offset, element: child };
        } else {
          return closest;
        }
      }, { offset: Number.NEGATIVE_INFINITY }).element;
    }

    function exportData() {
      const blob = new Blob([JSON.stringify(tasksData)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'tablero_cc17.json'; a.click();
      URL.revokeObjectURL(url);
    }
    
    function resetBoard() {
      alert("Para resetear toda la base de datos, debes borrar los registros manualmente o recrear la tabla.");
    }

    // Inicializar
    loadTasks();
  </script>
</body>
</html>
