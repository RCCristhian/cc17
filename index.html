<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    .kanban-board { display: flex; gap: 1.25rem; height: calc(100vh - 6rem); padding: 1.5rem; overflow-x: auto; align-items: flex-start; }
    .kanban-column { flex: 1; min-width: 320px; max-width: 400px; background: var(--card); border: 1px solid var(--border); border-radius: 0.75rem; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,0.05); max-height: 100%; }
    .kanban-column-header { padding: 1rem; font-weight: 600; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.02); }
    
    .kanban-cards { flex: 1; padding: 1rem; overflow-y: auto; display: flex; flex-direction: column; gap: 0.75rem; min-height: 200px; }
    
    .kanban-card { 
      background: var(--background); 
      border: 1px solid var(--border); 
      border-radius: 0.5rem; 
      padding: 1rem; 
      cursor: grab; 
      transition: box-shadow 0.2s, transform 0.2s, border-color 0.2s;
      position: relative;
    }
    .kanban-card:hover { box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); border-color: #9ca3af; }
    .kanban-card:active { cursor: grabbing; }
    .kanban-card.dragging { opacity: 0.4; }
    
    .kanban-card.is-priority {
      border-left: 4px solid rgb(239, 68, 68);
    }
    
    .tag { display: inline-block; padding: 0.25rem 0.6rem; border-radius: 9999px; font-size: 0.7rem; font-weight: 700; margin-bottom: 0.5rem; margin-right: 0.25rem; text-transform: uppercase; letter-spacing: 0.05em; }
    
    /* Project Tags */
    .tag-indep { background-color: rgba(59, 130, 246, 0.15); color: rgb(37, 99, 235); }
    .tag-lord { background-color: rgba(16, 185, 129, 0.15); color: rgb(5, 150, 105); }
    .tag-paget { background-color: rgba(139, 92, 246, 0.15); color: rgb(109, 40, 217); }
    .tag-transv { background-color: rgba(245, 158, 11, 0.15); color: rgb(217, 119, 6); }
    .tag-custom { background-color: rgba(107, 114, 128, 0.15); color: rgb(75, 85, 99); }
    
    /* Priority Tag */
    .tag-priority { background-color: rgba(239, 68, 68, 0.15); color: rgb(220, 38, 38); display: inline-flex; align-items: center; gap: 0.25rem; }
    
    .delete-btn { display: none; position: absolute; top: 0.5rem; right: 0.5rem; color: var(--muted-foreground); cursor: pointer; padding: 0.25rem; }
    .kanban-card:hover .delete-btn { display: block; }
    .delete-btn:hover { color: rgb(239, 68, 68); }

    /* Modal styles */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 50; justify-content: center; align-items: center; }
    .modal-overlay.active { display: flex; }
    .modal-content { background: var(--card); padding: 1.5rem; border-radius: 0.75rem; width: 100%; max-width: 400px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
  </style>
</head>
<body class="bg-[var(--background)] text-[var(--foreground)] antialiased h-screen overflow-hidden flex flex-col m-0 font-sans">
  
  <header class="p-4 border-b border-[var(--border)] bg-[var(--card)] flex justify-between items-center shadow-sm z-10 shrink-0">
    <div>
      <h1 class="text-xl font-bold tracking-tight">Programa de Trabajo - Comercial</h1>
      <p class="text-sm text-[var(--muted-foreground)]">Arrastra las tarjetas, crea nuevas o marca las prioritarias.</p>
    </div>
    <div class="flex gap-2">
      <button onclick="openAddModal()" class="text-sm bg-blue-600 text-white hover:bg-blue-700 px-4 py-2 rounded-md font-medium transition-colors shadow-sm">
        + Nueva Tarea
      </button>
    </div>
  </header>
  
  <main class="kanban-board">
    <div class="kanban-column">
      <div class="kanban-column-header">
         <span>📝 Por Hacer</span>
         <span class="bg-[var(--border)] px-2 py-0.5 rounded-full text-xs" id="count-todo">0</span>
      </div>
      <div class="kanban-cards dropzone" id="todo"></div>
    </div>
    
    <div class="kanban-column">
      <div class="kanban-column-header">
         <span>⏳ En Progreso</span>
         <span class="bg-[var(--border)] px-2 py-0.5 rounded-full text-xs" id="count-in-progress">0</span>
      </div>
      <div class="kanban-cards dropzone" id="in-progress"></div>
    </div>
    
    <div class="kanban-column">
      <div class="kanban-column-header">
         <span>✅ Terminado</span>
         <span class="bg-[var(--border)] px-2 py-0.5 rounded-full text-xs" id="count-done-col">0</span>
      </div>
      <div class="kanban-cards dropzone" id="done-col"></div>
    </div>
  </main>

  <!-- Add/Edit Task Modal -->
  <div id="addModal" class="modal-overlay">
    <div class="modal-content">
      <h2 id="modalTitle" class="text-lg font-bold mb-4">Añadir Nueva Tarea</h2>
      <input type="hidden" id="editingTaskId">
      <div class="flex flex-col gap-3">
        <div>
          <label class="block text-sm font-medium mb-1">Proyecto</label>
          <div class="flex gap-2 items-center">
            <select id="taskProjectSelect" onchange="handleProjectChange()" class="flex-1 border border-[var(--border)] bg-[var(--background)] rounded-md p-2 text-sm focus:outline-none focus:border-blue-500">
            </select>
            <div class="flex items-center gap-1.5 bg-[var(--background)] border border-[var(--border)] rounded-md p-1 px-2.5 h-[38px]" title="Color de la etiqueta del proyecto">
              <span class="text-xs text-[var(--muted-foreground)] font-medium">Color:</span>
              <input type="color" id="taskColorInput" value="#3b82f6" class="w-6 h-6 border-0 rounded cursor-pointer bg-transparent">
            </div>
          </div>
        </div>

        <div id="newProjectContainer" style="display: none;" class="p-3 bg-blue-50 border border-blue-200 rounded-md">
          <label class="block text-xs font-bold text-blue-800 uppercase tracking-wide mb-1">Nombre del Nuevo Proyecto</label>
          <input type="text" id="newProjectInput" placeholder="Ej: Miraflores II" class="w-full border border-blue-300 bg-white rounded-md p-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Título de la Tarea</label>
          <input type="text" id="newTaskTitle" placeholder="Ej: Renders de fachada" class="w-full border border-[var(--border)] bg-[var(--background)] rounded-md p-2 text-sm focus:outline-none focus:border-blue-500">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Descripción</label>
          <textarea id="newTaskDesc" rows="3" placeholder="Detalles de la tarea..." class="w-full border border-[var(--border)] bg-[var(--background)] rounded-md p-2 text-sm focus:outline-none focus:border-blue-500 resize-none"></textarea>
        </div>
        <div class="flex items-center gap-2 mt-1">
          <input type="checkbox" id="newTaskPriority" class="w-4 h-4 rounded text-blue-600 focus:ring-blue-500 cursor-pointer">
          <label for="newTaskPriority" class="text-sm font-medium text-red-600 flex items-center gap-1 cursor-pointer select-none">🔥 Marcar como Prioritario</label>
        </div>
      </div>
      <div class="flex justify-end gap-2 mt-5">
        <button onclick="closeModal()" class="px-4 py-2 text-sm border border-[var(--border)] rounded-md hover:bg-[var(--accent)] font-medium">Cancelar</button>
        <button onclick="saveTask()" class="px-4 py-2 text-sm bg-blue-600 text-white rounded-md hover:bg-blue-700 font-medium shadow-sm">Guardar Tarea</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://cegnqgqftdiramaoebsy.supabase.co/rest/v1/tasks';
    const SUPABASE_KEY = 'sb_publishable_oOBGRvcqeH1QxFnG7zIY0g_A_eNAk6u';
    
    const HEADERS = {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY,
      'Content-Type': 'application/json',
      'Prefer': 'return=representation'
    };

    const defaultProjects = [
      { name: "Independencia & Teruel", color: "#3b82f6" },
      { name: "Lord Cochrane 4", color: "#10b981" },
      { name: "Paget 01 y 02", color: "#8b5cf6" },
      { name: "Apoyo Transversal", color: "#f59e0b" }
    ];

    let tasksData = [];

    function getKnownProjects() {
      const map = new Map();
      defaultProjects.forEach(p => map.set(p.name, p.color));
      
      try {
        const stored = JSON.parse(localStorage.getItem('cc17_custom_projects') || '[]');
        stored.forEach(p => map.set(p.name, p.color));
      } catch (e) {}

      tasksData.forEach(t => {
        if (t.project && !map.has(t.project)) {
          let c = t.tag_class && t.tag_class.startsWith('#') ? t.tag_class : '#3b82f6';
          map.set(t.project, c);
        }
      });

      return Array.from(map.entries()).map(([name, color]) => ({ name, color }));
    }

    function populateProjectDropdown(selectedName) {
      const select = document.getElementById('taskProjectSelect');
      select.innerHTML = '';
      
      const projects = getKnownProjects();
      projects.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p.name;
        opt.textContent = p.name;
        opt.setAttribute('data-color', p.color);
        if (p.name === selectedName) opt.selected = true;
        select.appendChild(opt);
      });

      const newOpt = document.createElement('option');
      newOpt.value = '__new__';
      newOpt.textContent = '➕ Crear nuevo proyecto...';
      select.appendChild(newOpt);

      handleProjectChange();
    }

    function handleProjectChange() {
      const select = document.getElementById('taskProjectSelect');
      const newContainer = document.getElementById('newProjectContainer');
      const colorInput = document.getElementById('taskColorInput');

      if (select.value === '__new__') {
        newContainer.style.display = 'block';
        document.getElementById('newProjectInput').value = '';
        document.getElementById('newProjectInput').focus();
      } else {
        newContainer.style.display = 'none';
        const opt = select.options[select.selectedIndex];
        if (opt && opt.getAttribute('data-color')) {
          colorInput.value = opt.getAttribute('data-color');
        }
      }
    }

    async function loadTasks() {
      try {
        const res = await fetch(SUPABASE_URL, { headers: HEADERS });
        if (!res.ok) throw new Error('Error al conectar con la base de datos: ' + res.status);
        tasksData = await res.json();
        renderBoard();
      } catch (e) {
        console.error(e);
        alert("Error cargando tareas: " + e.message);
      }
    }

    function renderBoard() {
      ['todo', 'in-progress', 'done-col'].forEach(colId => {
        const col = document.getElementById(colId);
        if (!col) return;
        col.innerHTML = '';
        
        const colTasks = tasksData.filter(t => t.col_id === colId);
        
        colTasks.forEach(task => {
          const card = document.createElement('div');
          card.className = `kanban-card text-sm ${task.priority ? 'is-priority' : ''}`;
          card.draggable = true;
          card.id = task.id;
          
          let tagColor = task.tag_class;
          if (!tagColor || !tagColor.startsWith('#')) {
            const classColors = {
              'tag-indep': '#3b82f6',
              'tag-lord': '#10b981',
              'tag-paget': '#8b5cf6',
              'tag-transv': '#f59e0b',
              'tag-custom': '#6b7280'
            };
            tagColor = classColors[task.tag_class] || '#3b82f6';
          }
          
          let tagsHtml = `<span class="tag" style="background-color: ${tagColor}22; color: ${tagColor}; border: 1px solid ${tagColor}44;">${task.project}</span>`;
          if (task.priority) {
            tagsHtml += `<span class="tag tag-priority">🔥 Prioritario</span>`;
          }
          
          card.innerHTML = `
            <div class="delete-btn" style="right: 2.2rem; color: #3b82f6;" onclick="editTask('${task.id}')" title="Editar tarea">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
            </div>
            <div class="delete-btn" onclick="deleteTask('${task.id}')" title="Eliminar tarea">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            </div>
            <div class="mb-3">${tagsHtml}</div>
            <div class="font-bold text-base mb-1.5 text-[var(--foreground)] pr-12">${task.title}</div>
            <div class="text-[var(--muted-foreground)] leading-relaxed">${task.description}</div>
          `;
          
          card.addEventListener('dragstart', handleDragStart);
          card.addEventListener('dragend', handleDragEnd);
          col.appendChild(card);
        });
        
        const countEl = document.getElementById(`count-${colId}`);
        if (countEl) countEl.innerText = colTasks.length;
      });
    }

    async function saveTask() {
      try {
        const title = document.getElementById('newTaskTitle').value.trim();
        const desc = document.getElementById('newTaskDesc').value.trim();
        const priority = document.getElementById('newTaskPriority').checked;
        const select = document.getElementById('taskProjectSelect');
        const color = document.getElementById('taskColorInput').value;
        const editingId = document.getElementById('editingTaskId').value;

        if (!title) return alert("El título de la tarea es obligatorio.");

        let projectName = select.value;
        if (projectName === '__new__') {
          projectName = document.getElementById('newProjectInput').value.trim();
          if (!projectName) return alert("Por favor escribe el nombre del nuevo proyecto.");
          
          // Guardar proyecto en caché local
          try {
            const stored = JSON.parse(localStorage.getItem('cc17_custom_projects') || '[]');
            stored.push({ name: projectName, color: color });
            localStorage.setItem('cc17_custom_projects', JSON.stringify(stored));
          } catch(e) {}
        }

        const taskObj = {
          col_id: 'todo',
          project: projectName,
          tag_class: color,
          title: title,
          description: desc,
          priority: priority
        };

        if (editingId) {
          taskObj.id = editingId;
          const oldTask = tasksData.find(t => t.id === editingId);
          taskObj.col_id = oldTask ? oldTask.col_id : 'todo';
          
          const res = await fetch(`${SUPABASE_URL}?id=eq.${editingId}`, {
            method: 'PATCH',
            headers: HEADERS,
            body: JSON.stringify(taskObj)
          });
          if (!res.ok) throw new Error("HTTP " + res.status + " " + await res.text());
          const idx = tasksData.findIndex(t => t.id === editingId);
          if (idx !== -1) tasksData[idx] = taskObj;
        } else {
          taskObj.id = 't' + Date.now();
          const res = await fetch(SUPABASE_URL, {
            method: 'POST',
            headers: HEADERS,
            body: JSON.stringify(taskObj)
          });
          if (!res.ok) throw new Error("HTTP " + res.status + " " + await res.text());
          tasksData.push(taskObj);
        }

        renderBoard();
        closeModal();
      } catch (e) {
        alert("Error al guardar: " + e.message);
        console.error(e);
      }
    }

    function editTask(id) {
      const task = tasksData.find(t => t.id === id);
      if (!task) return;
      
      document.getElementById('modalTitle').innerText = 'Editar Tarea';
      document.getElementById('editingTaskId').value = task.id;
      document.getElementById('newTaskTitle').value = task.title;
      document.getElementById('newTaskDesc').value = task.description;
      document.getElementById('newTaskPriority').checked = task.priority;
      
      populateProjectDropdown(task.project);
      
      if (task.tag_class && task.tag_class.startsWith('#')) {
        document.getElementById('taskColorInput').value = task.tag_class;
      }
      
      document.getElementById('addModal').classList.add('active');
    }

    async function deleteTask(id) {
      if(!confirm("¿Estás seguro de eliminar esta tarea?")) return;
      try {
        const res = await fetch(`${SUPABASE_URL}?id=eq.${id}`, { method: 'DELETE', headers: HEADERS });
        if (!res.ok) throw new Error("HTTP " + res.status + " " + await res.text());
        tasksData = tasksData.filter(t => t.id !== id);
        renderBoard();
      } catch (e) {
        alert("Error al borrar: " + e.message);
      }
    }

    function openAddModal() { 
      document.getElementById('modalTitle').innerText = 'Añadir Nueva Tarea';
      document.getElementById('editingTaskId').value = '';
      document.getElementById('newTaskTitle').value = '';
      document.getElementById('newTaskDesc').value = '';
      document.getElementById('newTaskPriority').checked = false;
      populateProjectDropdown();
      document.getElementById('addModal').classList.add('active'); 
      document.getElementById('newTaskTitle').focus(); 
    }
    
    function closeModal() {
      document.getElementById('addModal').classList.remove('active');
      document.getElementById('editingTaskId').value = '';
    }

    // Drag and Drop Logic
    let draggedCard = null;

    function handleDragStart(e) {
      draggedCard = this;
      setTimeout(() => this.classList.add('dragging'), 0);
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', this.id);
    }

    async function handleDragEnd(e) {
      this.classList.remove('dragging');
      const newColId = this.parentElement.id;
      const id = this.id;
      
      const task = tasksData.find(t => t.id === id);
      if (task && task.col_id !== newColId) {
        task.col_id = newColId;
        renderBoard();
        try {
          const res = await fetch(`${SUPABASE_URL}?id=eq.${id}`, {
            method: 'PATCH',
            headers: HEADERS,
            body: JSON.stringify({ col_id: newColId })
          });
          if (!res.ok) throw new Error("HTTP " + res.status + " " + await res.text());
        } catch (e) {
          alert("Error al guardar posición: " + e.message);
          console.error("No se pudo guardar la posición en el servidor");
        }
      }
      draggedCard = null;
    }

    document.querySelectorAll('.dropzone').forEach(zone => {
      zone.addEventListener('dragover', e => {
        e.preventDefault();
        const afterElement = getDragAfterElement(zone, e.clientY);
        if (draggedCard) {
          if (afterElement == null) {
            zone.appendChild(draggedCard);
          } else {
            zone.insertBefore(draggedCard, afterElement);
          }
        }
      });
    });

    function getDragAfterElement(container, y) {
      const draggableElements = [...container.querySelectorAll('.kanban-card:not(.dragging)')];
      return draggableElements.reduce((closest, child) => {
        const box = child.getBoundingClientRect();
        const offset = y - box.top - box.height / 2;
        if (offset < 0 && offset > closest.offset) {
          return { offset: offset, element: child };
        } else {
          return closest;
        }
      }, { offset: Number.NEGATIVE_INFINITY }).element;
    }

    // Inicializar
    loadTasks();
  </script>
</body>
</html>
