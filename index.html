<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metodología de Visualización | CC17</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23dc2626'/><rect x='2' y='2' width='60' height='60' rx='12' fill='none' stroke='%23f87171' stroke-width='2' opacity='0.6'/><text x='50%' y='54%' dominant-baseline='middle' text-anchor='middle' font-family='system-ui,sans-serif' font-weight='900' font-size='23' fill='%23ffffff' letter-spacing='-0.5'>CC17</text></svg>">
  <link rel="alternate icon" href="favicon.svg">
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: #07090e;
      background-image: 
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(99, 102, 241, 0.12), transparent),
        radial-gradient(ellipse 60% 40% at 85% 10%, rgba(59, 130, 246, 0.08), transparent);
      color: #f1f5f9;
    }
    
    .kanban-board {
      display: flex;
      gap: 1.25rem;
      height: calc(100vh - 5.75rem);
      padding: 1.25rem 1.5rem 1.5rem 1.5rem;
      width: 100%;
      box-sizing: border-box;
      align-items: stretch;
      overflow-x: auto;
    }

    .kanban-column {
      flex: 1 1 0%;
      min-width: 280px;
      background: #080a10 !important;
      border-radius: 1.25rem;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.85);
      height: 100%;
      transition: border-color 0.25s, box-shadow 0.25s;
    }

    .kanban-column-todo {
      border: 2.5px solid rgba(255, 255, 255, 0.22) !important;
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.9), 0 0 15px -3px rgba(255, 255, 255, 0.05) !important;
    }
    .kanban-column-todo .kanban-column-header {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.10) 0%, rgba(255, 255, 255, 0.03) 100%) !important;
      border-bottom: 2px solid rgba(255, 255, 255, 0.16) !important;
    }

    .kanban-column-paused {
      border: 2.5px solid rgba(245, 158, 11, 0.75) !important;
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.9), 0 0 24px -2px rgba(245, 158, 11, 0.28) !important;
    }
    .kanban-column-paused .kanban-column-header {
      background: linear-gradient(180deg, rgba(245, 158, 11, 0.32) 0%, rgba(245, 158, 11, 0.14) 100%) !important;
      border-bottom: 2px solid rgba(245, 158, 11, 0.55) !important;
    }

    .kanban-column-progress {
      border: 2.5px solid rgba(168, 85, 247, 0.75) !important;
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.9), 0 0 24px -2px rgba(168, 85, 247, 0.28) !important;
    }
    .kanban-column-progress .kanban-column-header {
      background: linear-gradient(180deg, rgba(168, 85, 247, 0.32) 0%, rgba(168, 85, 247, 0.14) 100%) !important;
      border-bottom: 2px solid rgba(168, 85, 247, 0.55) !important;
    }

    .kanban-column-done {
      border: 2.5px solid rgba(16, 185, 129, 0.75) !important;
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.9), 0 0 24px -2px rgba(16, 185, 129, 0.28) !important;
    }
    .kanban-column-done .kanban-column-header {
      background: linear-gradient(180deg, rgba(16, 185, 129, 0.32) 0%, rgba(16, 185, 129, 0.14) 100%) !important;
      border-bottom: 2px solid rgba(16, 185, 129, 0.55) !important;
    }

    /* Responsividad para celulares y pantallas pequeñas */
    @media (max-width: 768px) {
      body {
        overflow: hidden !important;
        height: 100vh !important;
        height: 100dvh !important;
      }

      header {
        padding: 0.65rem 0.75rem !important;
        gap: 0.5rem;
      }

      .kanban-board {
        display: flex !important;
        flex-direction: row !important;
        height: calc(100dvh - 3.85rem) !important;
        padding: 0.6rem 0.75rem 0.85rem 0.75rem !important;
        gap: 0.85rem !important;
        scroll-snap-type: x mandatory;
        -webkit-overflow-scrolling: touch;
        overflow-x: auto !important;
        overflow-y: hidden !important;
      }

      .kanban-column {
        flex: 0 0 85vw !important;
        min-width: 85vw !important;
        max-width: 85vw !important;
        scroll-snap-align: center;
        border-radius: 1.1rem !important;
        height: 100% !important;
      }

      .kanban-column-header {
        padding: 0.85rem 1rem !important;
      }

      .kanban-cards {
        padding: 0.75rem 0.65rem !important;
        gap: 0.75rem !important;
        overflow-y: auto !important;
      }

      .kanban-card {
        padding: 0.85rem !important;
      }

      .modal-content {
        padding: 1.25rem !important;
        border-radius: 1rem !important;
        margin: 0.5rem !important;
        max-height: 90vh !important;
        overflow-y: auto !important;
      }
    }

    .kanban-column-header {
      padding: 1.15rem 1.25rem;
      font-weight: 700;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.015);
    }

    .kanban-cards {
      flex: 1;
      padding: 1.5rem 1.25rem 1.25rem 1.25rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      min-height: 220px;
    }

    .working-outer-badge {
      position: absolute;
      top: -22px;
      left: 14px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 0;
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      color: #FFC20E;
      font-size: 11.5px;
      font-weight: 500;
      font-style: italic;
      letter-spacing: 0.02em;
      text-transform: none;
      z-index: 10;
      pointer-events: none;
    }

    /* Animación Typewriter: deletreo constante de "Trabajando..." */
    @keyframes typeWorkingAnim {
      0%, 5% { width: 0ch; }
      58%, 80% { width: 13.2ch; }
      94%, 100% { width: 0ch; }
    }

    @keyframes cursorBlinkAnim {
      0%, 100% { border-color: #FFC20E; }
      50% { border-color: transparent; }
    }

    .typewriter-working {
      display: inline-block;
      overflow: hidden;
      white-space: nowrap;
      vertical-align: middle;
      border-right: 2px solid #FFC20E;
      width: 0ch;
      animation: typeWorkingAnim 3.2s steps(13, end) infinite, cursorBlinkAnim 0.6s infinite;
      color: #FFC20E;
      font-weight: 500;
      font-style: italic;
      text-shadow: 0 0 12px rgba(255, 194, 14, 0.8);
      font-family: inherit;
    }

    /* Resplandor y animación para la etiqueta en el color del proyecto (brillo suavizado) */
    @keyframes tagWorkingShimmer {
      0%, 100% {
        box-shadow: 0 0 7px var(--card-glow, rgba(59, 130, 246, 0.3)), inset 0 0 4px var(--card-glow, rgba(59, 130, 246, 0.15));
        border-color: var(--card-color, #3b82f6);
        transform: scale(1);
      }
      50% {
        box-shadow: 0 0 14px var(--card-glow, rgba(59, 130, 246, 0.55)), inset 0 0 6px var(--card-glow, rgba(59, 130, 246, 0.25));
        border-color: rgba(255, 255, 255, 0.8);
        transform: scale(1.025);
      }
    }

    .tag-working-active {
      animation: tagWorkingShimmer 2.2s infinite ease-in-out !important;
      font-weight: 700 !important;
      letter-spacing: 0.04em !important;
    }

    .kanban-cards::-webkit-scrollbar {
      width: 6px;
    }
    .kanban-cards::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 9999px;
    }

    .kanban-card {
      background: #131722;
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 1rem;
      padding: 1.15rem;
      cursor: grab;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      box-shadow: 0 4px 15px -3px rgba(0, 0, 0, 0.4);
    }

    .kanban-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px -5px rgba(0, 0, 0, 0.6);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .kanban-card:active {
      cursor: grabbing;
    }

    .kanban-card.dragging {
      opacity: 0.35;
      transform: scale(0.97);
    }

    .tag {
      display: inline-flex;
      align-items: center;
      padding: 0.25rem 0.65rem;
      border-radius: 9999px;
      font-size: 0.72rem;
      font-weight: 700;
      margin-bottom: 0.65rem;
      margin-right: 0.35rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      transition: all 0.2s;
    }

    .tag-priority {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.35);
      box-shadow: 0 0 10px -2px rgba(239, 68, 68, 0.3);
    }

    .card-actions {
      display: none;
      position: absolute;
      top: 0.85rem;
      right: 0.85rem;
      gap: 0.4rem;
      z-index: 20;
    }

    .kanban-card.has-working-btn .card-actions {
      right: 3.1rem;
    }

    .kanban-card:hover .card-actions {
      display: flex;
    }

    /* Pulso suave de baja a alta intensidad en el color del proyecto (sin pasar a blanco) */
    @keyframes workingCardPulse {
      0%, 100% {
        border-color: var(--card-color-soft, rgba(59, 130, 246, 0.35));
        box-shadow: 0 0 8px -2px var(--card-glow-soft, rgba(59, 130, 246, 0.2)),
                    0 4px 18px -3px rgba(0, 0, 0, 0.5);
      }
      50% {
        border-color: var(--card-color, #3b82f6);
        box-shadow: 0 0 20px 1px var(--card-glow, rgba(59, 130, 246, 0.6)),
                    inset 0 0 10px -2px var(--card-glow-soft, rgba(59, 130, 246, 0.2)),
                    0 6px 24px -2px rgba(0, 0, 0, 0.65);
      }
    }

    .kanban-card.is-active-working {
      margin-top: 8px;
      animation: workingCardPulse 2.4s infinite ease-in-out !important;
      border-width: 1.5px !important;
    }

    @keyframes pulseDotAnim {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.45); opacity: 0.45; }
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 9999px;
      display: inline-block;
      margin-right: 5px;
      animation: pulseDotAnim 1.2s infinite ease-in-out;
    }

    .working-circle-btn {
      width: 26px;
      height: 26px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, 0.85);
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      position: absolute;
      top: 0.85rem;
      right: 0.85rem;
      z-index: 10;
    }

    .working-circle-btn:hover {
      transform: scale(1.15);
      border-color: #FFC20E;
      box-shadow: 0 0 14px rgba(255, 194, 14, 0.5);
    }

    .working-circle-btn .circle-inner {
      width: 8px;
      height: 8px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.35);
      transition: all 0.25s;
    }

    .working-circle-btn.is-active {
      background: rgba(0, 0, 0, 0.9);
      border-color: #FFC20E;
      box-shadow: 0 0 16px rgba(255, 194, 14, 0.6);
    }

    .working-circle-btn.is-active .circle-inner {
      background: #FFC20E;
      box-shadow: 0 0 10px #FFC20E;
      animation: pulseDotAnim 1.1s infinite alternate ease-in-out;
    }

    .action-icon-btn {
      width: 28px;
      height: 28px;
      border-radius: 0.5rem;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #94a3b8;
      transition: all 0.2s;
    }

    .action-icon-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      transform: scale(1.05);
    }

    .action-icon-btn.duplicate:hover {
      background: rgba(59, 130, 246, 0.25);
      border-color: rgba(59, 130, 246, 0.4);
      color: #60a5fa;
    }

    .action-icon-btn.delete:hover {
      background: rgba(239, 68, 68, 0.25);
      border-color: rgba(239, 68, 68, 0.4);
      color: #ef4444;
    }

    /* Modal styles */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      z-index: 50;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background: #0f131c;
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 1.75rem;
      border-radius: 1.25rem;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.85), 0 0 30px rgba(59, 130, 246, 0.1);
    }

    .color-preset-btn {
      width: 26px;
      height: 26px;
      border-radius: 9999px;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
    }
    .color-preset-btn:hover {
      transform: scale(1.15);
    }
    .color-preset-btn.active {
      border-color: #ffffff;
      transform: scale(1.15);
    }
  </style>
</head>
<body class="antialiased h-screen overflow-hidden flex flex-col m-0 select-none">
  
  <!-- Header con estética moderna CC17 -->
  <header class="py-2.5 sm:py-3 px-3 sm:px-8 border-b border-white/[0.08] bg-[#090b10]/95 backdrop-blur-md flex justify-between items-center z-10 shrink-0 gap-2">
    <!-- Logo a la izquierda -->
    <div class="flex items-center shrink-0">
      <img src="logo.png" alt="CC17" class="h-7 sm:h-9 w-auto object-contain select-none filter drop-shadow-[0_0_12px_rgba(185,28,28,0.5)]">
    </div>

    <!-- Filtro por proyecto y Botones a la derecha -->
    <div class="flex items-center gap-1.5 sm:gap-3 flex-wrap justify-end">
      <!-- Selector de Filtro -->
      <div class="flex items-center gap-1.5 sm:gap-2 bg-[#121622] border border-white/10 hover:border-white/20 rounded-xl px-2 sm:px-3 py-1.5 sm:py-2 shadow-sm transition-all">
        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="text-slate-400 shrink-0"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
        <span class="text-xs font-bold text-slate-400 hidden md:inline">Filtrar:</span>
        <select id="projectFilterSelect" onchange="handleFilterChange(this.value)" class="bg-transparent text-xs font-bold text-white focus:outline-none cursor-pointer pr-1 max-w-[85px] sm:max-w-none truncate">
          <option value="ALL" class="bg-[#0c1017] text-white">Todos</option>
        </select>
      </div>

      <button onclick="openProjectManagerModal()" class="flex items-center gap-1.5 sm:gap-2 text-xs sm:text-sm font-semibold bg-[#131722] hover:bg-[#1a2030] text-slate-200 border border-white/10 hover:border-white/20 px-2.5 sm:px-4 py-1.5 sm:py-2 rounded-xl transition-all shadow-md hover:scale-[1.02] active:scale-[0.98]">
        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shrink-0"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
        <span class="hidden sm:inline">Gestionar Proyectos</span>
        <span class="sm:hidden">Proyectos</span>
      </button>

      <button onclick="openAddModal()" class="flex items-center gap-1.5 sm:gap-2 text-xs sm:text-sm font-semibold bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white px-2.5 sm:px-4 py-1.5 sm:py-2 rounded-xl transition-all shadow-lg shadow-blue-600/30 hover:shadow-blue-500/50 hover:scale-[1.02] active:scale-[0.98]">
        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="shrink-0"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        <span class="hidden sm:inline">Nueva Tarjeta</span>
        <span class="sm:hidden">Nueva</span>
      </button>
    </div>
  </header>
  
  <!-- Kanban Board -->
  <main class="kanban-board">
    <!-- Columna 1: Por Iniciar -->
    <div class="kanban-column kanban-column-todo">
      <div class="kanban-column-header">
        <div class="flex items-center gap-2.5">
          <div class="w-6 h-6 rounded-full bg-white/10 border border-white/20 text-white text-xs font-bold flex items-center justify-center shadow-inner">
            1
          </div>
          <span class="text-sm font-extrabold tracking-wide text-white">Por Iniciar</span>
        </div>
        <span class="bg-white/10 text-white border border-white/20 px-2.5 py-0.5 rounded-full text-xs font-bold" id="count-todo">0</span>
      </div>
      <div class="kanban-cards dropzone" id="todo"></div>
    </div>

    <!-- Columna 2: En Pausa -->
    <div class="kanban-column kanban-column-paused">
      <div class="kanban-column-header">
        <div class="flex items-center gap-2.5">
          <div class="w-6 h-6 rounded-full bg-amber-500/25 border border-amber-400/50 text-amber-300 text-xs font-bold flex items-center justify-center shadow-[0_0_12px_rgba(245,158,11,0.4)]">
            2
          </div>
          <span class="text-sm font-extrabold tracking-wide text-amber-100">En Pausa</span>
        </div>
        <span class="bg-amber-500/20 text-amber-300 border border-amber-400/40 px-2.5 py-0.5 rounded-full text-xs font-bold" id="count-paused">0</span>
      </div>
      <div class="kanban-cards dropzone" id="paused"></div>
    </div>
    
    <!-- Columna 3: En Progreso -->
    <div class="kanban-column kanban-column-progress">
      <div class="kanban-column-header">
        <div class="flex items-center gap-2.5">
          <div class="w-6 h-6 rounded-full bg-purple-500/25 border border-purple-400/50 text-purple-300 text-xs font-bold flex items-center justify-center shadow-[0_0_12px_rgba(168,85,247,0.4)]">
            3
          </div>
          <span class="text-sm font-extrabold tracking-wide text-purple-100">En Progreso</span>
        </div>
        <span class="bg-purple-500/20 text-purple-300 border border-purple-400/40 px-2.5 py-0.5 rounded-full text-xs font-bold" id="count-in-progress">0</span>
      </div>
      <div class="kanban-cards dropzone" id="in-progress"></div>
    </div>
    
    <!-- Columna 4: Terminado -->
    <div class="kanban-column kanban-column-done">
      <div class="kanban-column-header">
        <div class="flex items-center gap-2.5">
          <div class="w-6 h-6 rounded-full bg-emerald-500/25 border border-emerald-400/50 text-emerald-300 text-xs font-bold flex items-center justify-center shadow-[0_0_12px_rgba(16,185,129,0.4)]">
            4
          </div>
          <span class="text-sm font-extrabold tracking-wide text-emerald-100">Terminado</span>
        </div>
        <span class="bg-emerald-500/20 text-emerald-300 border border-emerald-400/40 px-2.5 py-0.5 rounded-full text-xs font-bold" id="count-done-col">0</span>
      </div>
      <div class="kanban-cards dropzone" id="done-col"></div>
    </div>
  </main>

  <!-- Modal para Agregar / Editar Tarjeta con Selector de Color Libre -->
  <div id="addModal" class="modal-overlay">
    <div class="modal-content">
      <div class="flex justify-between items-center mb-5">
        <h2 id="modalTitle" class="text-base font-extrabold tracking-tight text-white flex items-center gap-2">
          <span>Nueva Tarjeta</span>
        </h2>
        <button onclick="closeModal()" class="text-slate-400 hover:text-white p-1 rounded-lg">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>

      <input type="hidden" id="editingTaskId">

      <div class="flex flex-col gap-4">
        <!-- Selector de Proyecto -->
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-1.5">Proyecto</label>
          <select id="taskProjectSelect" onchange="handleProjectChange()" class="w-full bg-[#080a0f] border border-white/10 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
          </select>
        </div>

        <!-- Campo adicional si elige "+ Crear nuevo proyecto" -->
        <div id="newProjectContainer" style="display: none;" class="p-3 bg-blue-950/30 border border-blue-500/30 rounded-xl">
          <label class="block text-xs font-bold text-blue-300 uppercase tracking-wide mb-1">Nombre del Nuevo Proyecto</label>

  <div id="projectManagerModal" class="modal-overlay">

        <!-- Rendered dynamically -->
      </div>

      <div class="flex justify-end mt-5 pt-3 border-t border-white/[0.08]">
        <button onclick="closeProjectManagerModal()" class="px-5 py-2 text-sm font-semibold text-slate-300 hover:text-white border border-white/10 rounded-xl hover:bg-white/5 transition-colors">
          Cerrar

  <script>
    const SUPABASE_URL = 'https://cegnqgqftdiramaoebsy.supabase.co/rest/v1/tasks';
    const SUPABASE_KEY = 'sb_publishable_oOBGRvcqeH1QxFnG7zIY0g_A_eNAk6u';
    
    const HEADERS = {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY,
      'Content-Type': 'application/json',
      'Prefer': 'return=representation'
    };

    let defaultProjects = [
      { name: "Independencia & Teruel", color: "#3b82f6" },
      { name: "Lord Cochrane 4", color: "#10b981" },
      { name: "Apoyo Transversal", color: "#f59e0b" }
    ];

    let tasksData = [];

    function selectPresetColor(hex) {
      document.getElementById('taskColorInput').value = hex;
      updateActivePresetButton(hex);
    }

    function onCustomColorPick(hex) {
      updateActivePresetButton(hex);
    }

    function updateActivePresetButton(hex) {
      document.querySelectorAll('.color-preset-btn').forEach(btn => {
        if (btn.getAttribute('onclick').includes(hex)) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
    }

    // --- GESTIÓN DE PROYECTOS ---
    function openProjectManagerModal() {
      document.getElementById('projectManagerModal').classList.add('active');
      renderProjectManagerList();
    }

    function closeProjectManagerModal() {
      document.getElementById('projectManagerModal').classList.remove('active');
    }

    function sanitizeId(str) {
      return encodeURIComponent(str).replace(/[^a-zA-Z0-9]/g, '_');
    }

    function renderProjectManagerList() {
      const container = document.getElementById('projectManagerList');
      if (!container) return;
      container.innerHTML = '';
      
      const projects = getKnownProjects();
      if (projects.length === 0) {
        container.innerHTML = `<div class="text-sm text-slate-500 py-3 text-center">No hay proyectos registrados aún.</div>`;
        return;
      }

      projects.forEach(p => {
        const sid = sanitizeId(p.name);
        const taskCount = tasksData.filter(t => t.project === p.name).length;
        
        const row = document.createElement('div');
        row.className = "p-3 bg-[#0c1017] border border-white/[0.08] rounded-xl flex items-center justify-between gap-3";
        row.id = `pm-row-${sid}`;
        
        row.innerHTML = `
          <!-- Vista normal -->
          <div class="flex items-center gap-3 flex-1 min-w-0" id="pm-view-${sid}">
            <div class="w-4 h-4 rounded-full shrink-0 shadow-sm" style="background-color: ${p.color}; box-shadow: 0 0 10px ${p.color}88;"></div>
            <div class="flex items-center gap-2 truncate">
              <span class="text-sm font-bold text-white truncate" id="pm-name-display-${sid}">${p.name}</span>
              <span class="text-[11px] font-semibold text-slate-400 bg-white/5 border border-white/10 px-2 py-0.5 rounded-full shrink-0">
                ${taskCount} ${taskCount === 1 ? 'tarjeta' : 'tarjetas'}
              </span>
            </div>
          </div>

          <!-- Vista edición -->
          <div class="hidden flex-1 items-center gap-2" id="pm-edit-${sid}">
            <input type="text" class="flex-1 bg-[#121622] border border-blue-500/70 rounded-lg p-1.5 px-2.5 text-xs text-white focus:outline-none focus:ring-1 focus:ring-blue-500" value="${p.name.replace(/"/g, '&quot;')}" id="pm-input-${sid}">
            <input type="color" class="w-7 h-7 border-0 bg-transparent cursor-pointer shrink-0" value="${p.color}" id="pm-color-${sid}" title="Cambiar color del proyecto">
            <button onclick="saveProjectRename('${p.name.replace(/'/g, "\\'")}')" class="px-3 py-1 bg-green-600 hover:bg-green-500 text-white text-xs font-bold rounded-lg shadow-sm">Guardar</button>
            <button onclick="cancelProjectRename('${p.name.replace(/'/g, "\\'")}')" class="px-2 py-1 text-slate-400 hover:text-white text-xs">Cancelar</button>
          </div>

          <!-- Botones de acción -->
          <div class="flex items-center gap-1.5 shrink-0" id="pm-actions-${sid}">
            <button onclick="startProjectRename('${p.name.replace(/'/g, "\\'")}')" class="action-icon-btn !flex !static" title="Editar nombre y color en todas las tarjetas">
              <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
            </button>
            <button onclick="deleteProjectFromManager('${p.name.replace(/'/g, "\\'")}')" class="action-icon-btn delete !flex !static" title="Eliminar proyecto">
              <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            </button>
          </div>
        `;
        
        container.appendChild(row);
      });
    }

    function startProjectRename(name) {
      const sid = sanitizeId(name);
      document.getElementById(`pm-view-${sid}`).classList.add('hidden');
      document.getElementById(`pm-actions-${sid}`).classList.add('hidden');
      const editDiv = document.getElementById(`pm-edit-${sid}`);
      editDiv.classList.remove('hidden');
      editDiv.classList.add('flex');
      document.getElementById(`pm-input-${sid}`).focus();
    }

    function cancelProjectRename(name) {
      const sid = sanitizeId(name);
      document.getElementById(`pm-view-${sid}`).classList.remove('hidden');
      document.getElementById(`pm-actions-${sid}`).classList.remove('hidden');
      const editDiv = document.getElementById(`pm-edit-${sid}`);
      editDiv.classList.remove('flex');
      editDiv.classList.add('hidden');
    }

    async function saveProjectRename(oldName) {
      const sid = sanitizeId(oldName);
      const newName = document.getElementById(`pm-input-${sid}`).value.trim();
      const newColor = document.getElementById(`pm-color-${sid}`).value;

      if (!newName) return alert("El nombre del proyecto no puede estar vacío.");

      try {
        // 1. Actualizar todas las tarjetas en memoria
        let affectedCount = 0;
        tasksData.forEach(t => {
          if (t.project === oldName) {
            t.project = newName;
            t.tag_class = newColor;
            affectedCount++;
          }
        });

        // 2. Actualizar en Supabase para todas las tareas con ese proyecto
        if (affectedCount > 0) {
          const res = await fetch(`${SUPABASE_URL}?project=eq.${encodeURIComponent(oldName)}`, {
            method: 'PATCH',
            headers: HEADERS,
            body: JSON.stringify({ project: newName, tag_class: newColor })
          });
          if (!res.ok) console.warn("Aviso al sincronizar con Supabase:", await res.text());
        }

        // 3. Actualizar almacenamiento local de proyectos
        let stored = [];
        try {
          stored = JSON.parse(localStorage.getItem('cc17_custom_projects') || '[]');
        } catch (e) {}

        stored = stored.filter(p => p.name !== oldName);
        stored.push({ name: newName, color: newColor });
        localStorage.setItem('cc17_custom_projects', JSON.stringify(stored));

        // 4. Actualizar defaultProjects si estaba allí
        const def = defaultProjects.find(p => p.name === oldName);
        if (def) {
          def.name = newName;
          def.color = newColor;
        }

        let deletedDefaults = [];
        try {
          deletedDefaults = JSON.parse(localStorage.getItem('cc17_deleted_defaults') || '[]');
        } catch (e) {}
        if (!deletedDefaults.includes(oldName)) {
          deletedDefaults.push(oldName);
          localStorage.setItem('cc17_deleted_defaults', JSON.stringify(deletedDefaults));
        }

        // 5. Re-renderizar tablero y modal
        renderBoard();
        renderProjectManagerList();
        populateProjectDropdown();

      } catch (e) {
        alert("Error al actualizar proyecto: " + e.message);
      }
    }

    async function createNewProjectFromManager() {
      const nameInput = document.getElementById('pmNewProjectName');
      const colorInput = document.getElementById('pmNewProjectColor');
      const name = nameInput.value.trim();
      const color = colorInput.value;

      if (!name) return alert("Por favor escribe el nombre del proyecto.");

      let stored = [];
      try {
        stored = JSON.parse(localStorage.getItem('cc17_custom_projects') || '[]');
      } catch (e) {}

      if (getKnownProjects().some(p => p.name.toLowerCase() === name.toLowerCase())) {
        return alert("Ya existe un proyecto con ese nombre.");
      }

      stored.push({ name, color });
      localStorage.setItem('cc17_custom_projects', JSON.stringify(stored));

      nameInput.value = '';
      renderProjectManagerList();
      populateProjectDropdown();
    }

    async function deleteProjectFromManager(name) {
      const taskCount = tasksData.filter(t => t.project === name).length;
      let msg = `¿Deseas eliminar el proyecto "${name}"?`;
      if (taskCount > 0) {
        msg = `El proyecto "${name}" tiene ${taskCount} ${taskCount === 1 ? 'tarjeta asociada' : 'tarjetas asociadas'}. Si lo eliminas, las tarjetas pasarán a llamarse "Sin Proyecto". ¿Continuar?`;
      }

      if (!confirm(msg)) return;

      try {
        if (taskCount > 0) {
          tasksData.forEach(t => {
            if (t.project === name) {
              t.project = "Sin Proyecto";
            }
          });

          await fetch(`${SUPABASE_URL}?project=eq.${encodeURIComponent(name)}`, {
            method: 'PATCH',
            headers: HEADERS,
            body: JSON.stringify({ project: "Sin Proyecto" })
          });
        }

        // 1. Eliminar de defaultProjects si existe
        const defIdx = defaultProjects.findIndex(p => p.name === name);
        if (defIdx !== -1) {
          defaultProjects.splice(defIdx, 1);
        }

        // 2. Registrar en deletedDefaults para evitar que reaparezca
        let deletedDefaults = [];
        try {
          deletedDefaults = JSON.parse(localStorage.getItem('cc17_deleted_defaults') || '[]');
        } catch (e) {}
        if (!deletedDefaults.includes(name)) {
          deletedDefaults.push(name);
          localStorage.setItem('cc17_deleted_defaults', JSON.stringify(deletedDefaults));
        }

        // 3. Eliminar de cc17_custom_projects
        let stored = [];
        try {
          stored = JSON.parse(localStorage.getItem('cc17_custom_projects') || '[]');
        } catch (e) {}
        stored = stored.filter(p => p.name !== name);
        localStorage.setItem('cc17_custom_projects', JSON.stringify(stored));

        renderBoard();
        renderProjectManagerList();
        populateProjectDropdown();
      } catch (e) {
        alert("Error al eliminar proyecto: " + e.message);
      }
    }

    function getKnownProjects() {
      const map = new Map();

      let deletedDefaults = [];
      try {
        deletedDefaults = JSON.parse(localStorage.getItem('cc17_deleted_defaults') || '[]');
      } catch (e) {}

      // Bloquear Paget 01 y 02 explícitamente por si existía en localStorage antiguo
      if (!deletedDefaults.includes("Paget 01 y 02")) {
        deletedDefaults.push("Paget 01 y 02");
      }
      
      defaultProjects.forEach(p => {
        if (!deletedDefaults.includes(p.name)) {
          map.set(p.name, p.color);
        }
      });
      
      try {
        const stored = JSON.parse(localStorage.getItem('cc17_custom_projects') || '[]');
        stored.forEach(p => {
          if (!deletedDefaults.includes(p.name)) {
            map.set(p.name, p.color);
          }
        });
      } catch (e) {}

      tasksData.forEach(t => {
        if (t.project && !map.has(t.project) && !deletedDefaults.includes(t.project)) {
          let c = t.tag_class && t.tag_class.startsWith('#') ? t.tag_class : '#3b82f6';
          map.set(t.project, c);
        }
      });

      return Array.from(map.entries()).map(([name, color]) => ({ name, color }));
    }

    function populateProjectDropdown(selectedName) {
      const select = document.getElementById('taskProjectSelect');
      select.innerHTML = '';
      
      const projects = getKnownProjects();
      projects.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p.name;
        opt.textContent = p.name;
        opt.setAttribute('data-color', p.color);
        if (p.name === selectedName) opt.selected = true;
        select.appendChild(opt);
      });

      const newOpt = document.createElement('option');
      newOpt.value = '__new__';
      newOpt.textContent = '➕ Crear nuevo proyecto...';
      select.appendChild(newOpt);

      handleProjectChange();
    }

    function handleProjectChange() {
      const select = document.getElementById('taskProjectSelect');
      const newContainer = document.getElementById('newProjectContainer');

      if (select.value === '__new__') {
        newContainer.style.display = 'block';
        document.getElementById('newProjectInput').value = '';
        document.getElementById('newProjectInput').focus();
      } else {
        newContainer.style.display = 'none';
        const opt = select.options[select.selectedIndex];
        if (opt && opt.getAttribute('data-color')) {
          selectPresetColor(opt.getAttribute('data-color'));
        }
      }
    }

    async function loadTasks() {
      try {
        const res = await fetch(SUPABASE_URL, { headers: HEADERS });
        if (!res.ok) throw new Error('Error al conectar con la base de datos: ' + res.status);
        tasksData = await res.json();
        renderBoard();
      } catch (e) {
        console.error(e);
        alert("Error cargando tareas: " + e.message);
      }
    }

    let currentProjectFilter = 'ALL';

    function handleFilterChange(val) {
      currentProjectFilter = val;
      renderBoard();
    }

    function updateProjectFilterDropdown() {
      const select = document.getElementById('projectFilterSelect');
      if (!select) return;
      const projects = getKnownProjects();
      
      const currentVal = currentProjectFilter;
      select.innerHTML = `<option value="ALL" class="bg-[#0c1017] text-white">Todos</option>`;
      
      projects.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p.name;
        opt.className = "bg-[#0c1017] text-white";
        opt.textContent = p.name;
        if (p.name === currentVal) opt.selected = true;
        select.appendChild(opt);
      });
    }

    function renderBoard() {
      updateProjectFilterDropdown();

      ['todo', 'paused', 'in-progress', 'done-col'].forEach(colId => {
        const col = document.getElementById(colId);
        if (!col) return;
        col.innerHTML = '';
        
        let colTasks = tasksData.filter(t => t.col_id === colId);

        // 1. Filtrar por proyecto seleccionado si no es 'ALL'
        if (currentProjectFilter && currentProjectFilter !== 'ALL') {
          colTasks = colTasks.filter(t => t.project === currentProjectFilter);
        }

        // 2. Ordenar y agrupar siempre por proyectos en "Por Iniciar", "En Pausa" y "Terminado"
        if (colId === 'todo' || colId === 'paused' || colId === 'done-col') {
          colTasks.sort((a, b) => {
            const pCompare = (a.project || '').localeCompare(b.project || '', undefined, { sensitivity: 'base' });
            if (pCompare !== 0) return pCompare;
            return (b.priority ? 1 : 0) - (a.priority ? 1 : 0);
          });
        }
        
        colTasks.forEach(task => {
          const card = document.createElement('div');
          card.draggable = true;
          card.id = task.id;
          
          const rawTag = task.tag_class || '#3b82f6';
          const isWorking = (colId === 'in-progress') && rawTag.includes(':working');
          const cleanTag = rawTag.replace(':working', '');

          // Resolver el color del proyecto asociado a la tarjeta
          const knownProject = getKnownProjects().find(p => p.name.toLowerCase() === (task.project || '').toLowerCase());
          let cardColor = (knownProject && knownProject.color) ? knownProject.color : cleanTag;
          if (!cardColor || !cardColor.startsWith('#') || cardColor.toLowerCase() === '#ffffff') {
            const classColors = {
              'tag-indep': '#3b82f6',
              'tag-lord': '#10b981',
              'tag-paget': '#8b5cf6',
              'tag-transv': '#f59e0b',
              'tag-custom': '#64748b'
            };
            cardColor = classColors[cleanTag] || (knownProject ? knownProject.color : '#3b82f6');
          }
          if (!cardColor || !cardColor.startsWith('#')) cardColor = '#3b82f6';

          // Extraer componentes RGB para colorear con precisión e intensidad
          let hexClean = cardColor.replace('#', '');
          if (hexClean.length === 3) hexClean = hexClean.split('').map(c => c + c).join('');
          const cr = parseInt(hexClean.substring(0, 2), 16) || 59;
          const cg = parseInt(hexClean.substring(2, 4), 16) || 130;
          const cb = parseInt(hexClean.substring(4, 6), 16) || 246;
          const rgb = `${cr}, ${cg}, ${cb}`;

          card.className = `kanban-card text-sm ${isWorking ? 'is-active-working' : ''} ${colId === 'in-progress' ? 'has-working-btn' : ''}`;
          
          card.style.setProperty('--card-color', cardColor);
          card.style.setProperty('--card-color-soft', `rgba(${rgb}, 0.5)`);
          card.style.setProperty('--card-glow', `rgba(${rgb}, 0.6)`);
          card.style.setProperty('--card-glow-soft', `rgba(${rgb}, 0.25)`);

          // Fondo 100% OPACO (sin transparencia) para que el color de la columna NUNCA se transparente
          const topR = Math.min(255, Math.round(cr * 0.35 + 8));
          const topG = Math.min(255, Math.round(cg * 0.35 + 10));
          const topB = Math.min(255, Math.round(cb * 0.35 + 16));

          const midR = Math.min(255, Math.round(cr * 0.22 + 8));
          const midG = Math.min(255, Math.round(cg * 0.22 + 9));
          const midB = Math.min(255, Math.round(cb * 0.22 + 13));

          const botR = Math.min(255, Math.round(cr * 0.12 + 6));
          const botG = Math.min(255, Math.round(cg * 0.12 + 7));
          const botB = Math.min(255, Math.round(cb * 0.12 + 10));

          card.style.background = `linear-gradient(145deg, rgb(${topR}, ${topG}, ${topB}) 0%, rgb(${midR}, ${midG}, ${midB}) 55%, rgb(${botR}, ${botG}, ${botB}) 100%)`;
          card.style.backgroundColor = `rgb(${midR}, ${midG}, ${midB})`;

          if (isWorking) {
            card.style.borderColor = '';
            card.style.boxShadow = '';
          } else {
            card.style.borderColor = `${cardColor}88`;
            card.style.boxShadow = `0 8px 24px -4px rgba(${rgb}, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.12)`;
          }

          if (task.priority) {
            card.style.borderLeft = `5.5px solid #ef4444`;
          } else {
            card.style.borderLeft = `4.5px solid ${cardColor}`;
          }
          
          let tagsHtml = `<span class="tag ${isWorking ? 'tag-working-active' : ''}" style="background-color: rgba(0, 0, 0, 0.45); color: #ffffff; border: 1.5px solid ${cardColor}; font-weight: 800; box-shadow: 0 0 10px ${cardColor}55;">${task.project}</span>`;
          if (colId === 'paused') {
            tagsHtml += `<span class="tag" style="background-color: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.35);">⏸️ Pausado</span>`;
          }
          if (task.priority) {
            tagsHtml += `<span class="tag tag-priority">🔥 Prioritario</span>`;
          }

          let workingStatusHtml = '';
          if (isWorking) {
            workingStatusHtml = `
              <div class="working-outer-badge">
                <span class="pulse-dot !w-2 !h-2 !mr-1" style="background-color: #FFC20E; box-shadow: 0 0 10px #FFC20E;"></span>
                <span class="typewriter-working">Trabajando...</span>
              </div>
            `;
          }

          let workingButtonHtml = '';
          if (colId === 'in-progress') {
            workingButtonHtml = `
              <button onclick="toggleWorking('${task.id}', event)" 
                class="working-circle-btn ${isWorking ? 'is-active' : ''}" 
                style="--card-color: #FFC20E; --card-glow: rgba(255, 194, 14, 0.6);" 
                title="${isWorking ? 'Activo: Trabajando actualmente. Clic para desactivar' : 'Clic para marcar: Trabajando ahora'}">
                <span class="circle-inner"></span>
              </button>
            `;
          }
          
          card.innerHTML = `
            ${workingStatusHtml}
            ${workingButtonHtml}
            <div class="card-actions">
              <button class="action-icon-btn duplicate" onclick="duplicateTask('${task.id}', event)" title="Duplicar tarjeta">
                <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                  <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
              </button>
              <button class="action-icon-btn" onclick="editTask('${task.id}')" title="Editar tarjeta">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
              </button>
              <button class="action-icon-btn delete" onclick="deleteTask('${task.id}')" title="Eliminar tarjeta">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
              </button>
            </div>
            <div class="mb-2 flex flex-wrap items-center gap-1">${tagsHtml}</div>
            <div class="font-bold text-base mb-1.5 text-white ${colId === 'in-progress' ? 'pr-36' : 'pr-28'} leading-snug">${task.title}</div>
            <div class="text-slate-400 text-xs leading-relaxed font-normal">${task.description}</div>
          `;
          
          card.addEventListener('dragstart', handleDragStart);
          card.addEventListener('dragend', handleDragEnd);
          col.appendChild(card);
        });
        
        const countEl = document.getElementById(`count-${colId}`);
        if (countEl) countEl.innerText = colTasks.length;
      });
    }

    async function toggleWorking(taskId, event) {
      if (event) event.stopPropagation();
      const task = tasksData.find(t => t.id === taskId);
      if (!task) return;

      const rawTag = task.tag_class || '#3b82f6';
      const isCurrentlyWorking = rawTag.includes(':working');
      const baseTag = rawTag.replace(':working', '');
      const newTag = isCurrentlyWorking ? baseTag : `${baseTag}:working`;

      task.tag_class = newTag;
      renderBoard();

      try {
        const res = await fetch(`${SUPABASE_URL}?id=eq.${taskId}`, {
          method: 'PATCH',
          headers: HEADERS,
          body: JSON.stringify({ tag_class: newTag })
        });
        if (!res.ok) console.warn("Aviso al guardar estado trabajando:", await res.text());
      } catch (e) {
        console.error("Error al actualizar estado trabajando:", e);
      }
    }

    async function saveTask() {
      try {
        const title = document.getElementById('newTaskTitle').value.trim();
        const desc = document.getElementById('newTaskDesc').value.trim();
        const priority = document.getElementById('newTaskPriority').checked;
        const select = document.getElementById('taskProjectSelect');
        const color = document.getElementById('taskColorInput').value;
        const editingId = document.getElementById('editingTaskId').value;

        if (!title) return alert("El título de la tarea es obligatorio.");

        let projectName = select.value;
        if (projectName === '__new__') {
          projectName = document.getElementById('newProjectInput').value.trim();
          if (!projectName) return alert("Por favor escribe el nombre del nuevo proyecto.");
          
          try {
            const stored = JSON.parse(localStorage.getItem('cc17_custom_projects') || '[]');
            stored.push({ name: projectName, color: color });
            localStorage.setItem('cc17_custom_projects', JSON.stringify(stored));
          } catch(e) {}
        }

        let tagClassVal = color;
        if (editingId) {
          const oldTask = tasksData.find(t => t.id === editingId);
          if (oldTask && oldTask.tag_class && oldTask.tag_class.includes(':working') && oldTask.col_id === 'in-progress') {
            tagClassVal = `${color}:working`;
          }
        }

        const taskObj = {
          col_id: 'todo',
          project: projectName,
          tag_class: tagClassVal,
          title: title,
          description: desc,
          priority: priority
        };

        if (editingId) {
          taskObj.id = editingId;
          const oldTask = tasksData.find(t => t.id === editingId);
          taskObj.col_id = oldTask ? oldTask.col_id : 'todo';
          
          const res = await fetch(`${SUPABASE_URL}?id=eq.${editingId}`, {
            method: 'PATCH',
            headers: HEADERS,
            body: JSON.stringify(taskObj)
          });
          if (!res.ok) throw new Error("HTTP " + res.status + " " + await res.text());
          const idx = tasksData.findIndex(t => t.id === editingId);
          if (idx !== -1) tasksData[idx] = taskObj;
        } else {
          taskObj.id = 't' + Date.now();
          const res = await fetch(SUPABASE_URL, {
            method: 'POST',
            headers: HEADERS,
            body: JSON.stringify(taskObj)
          });
          if (!res.ok) throw new Error("HTTP " + res.status + " " + await res.text());
          tasksData.push(taskObj);
        }

        renderBoard();
        closeModal();
      } catch (e) {
        alert("Error al guardar: " + e.message);
        console.error(e);
      }
    }

    function editTask(id) {
      const task = tasksData.find(t => t.id === id);
      if (!task) return;
      
      document.getElementById('modalTitle').innerText = 'Editar Tarjeta';
      document.getElementById('editingTaskId').value = task.id;
      document.getElementById('newTaskTitle').value = task.title;
      document.getElementById('newTaskDesc').value = task.description;
      document.getElementById('newTaskPriority').checked = task.priority;
      
      populateProjectDropdown(task.project);
      
      let color = task.tag_class || '#3b82f6';
      if (color.includes(':working')) color = color.replace(':working', '');
      if (!color.startsWith('#')) color = '#3b82f6';
      selectPresetColor(color);
      
      document.getElementById('addModal').classList.add('active');
    }

    async function duplicateTask(id, event) {
      if (event) event.stopPropagation();
      const original = tasksData.find(t => t.id === id);
      if (!original) return;

      try {
        const cleanTag = (original.tag_class || '#3b82f6').replace(':working', '');
        const newId = 't' + Date.now();
        const newTask = {
          id: newId,
          col_id: original.col_id || 'todo',
          project: original.project || 'Sin Proyecto',
          tag_class: cleanTag,
          title: original.title ? `${original.title} (Copia)` : 'Copia',
          description: original.description || '',
          priority: Boolean(original.priority)
        };

        const res = await fetch(SUPABASE_URL, {
          method: 'POST',
          headers: HEADERS,
          body: JSON.stringify(newTask)
        });

        if (!res.ok) throw new Error("HTTP " + res.status + " " + await res.text());

        const originalIndex = tasksData.findIndex(t => t.id === id);
        if (originalIndex !== -1) {
          tasksData.splice(originalIndex + 1, 0, newTask);
        } else {
          tasksData.push(newTask);
        }

        renderBoard();
      } catch (e) {
        alert("Error al duplicar tarjeta: " + e.message);
        console.error(e);
      }
    }

    async function deleteTask(id) {
      if(!confirm("¿Estás seguro de eliminar esta tarjeta?")) return;
      try {
        const res = await fetch(`${SUPABASE_URL}?id=eq.${id}`, { method: 'DELETE', headers: HEADERS });
        if (!res.ok) throw new Error("HTTP " + res.status + " " + await res.text());
        tasksData = tasksData.filter(t => t.id !== id);
        renderBoard();
      } catch (e) {
        alert("Error al borrar: " + e.message);
      }
    }

    function openAddModal() { 
      document.getElementById('modalTitle').innerText = 'Nueva Tarjeta';
      document.getElementById('editingTaskId').value = '';
      document.getElementById('newTaskTitle').value = '';
      document.getElementById('newTaskDesc').value = '';
      document.getElementById('newTaskPriority').checked = false;
      populateProjectDropdown();
      document.getElementById('addModal').classList.add('active'); 
      document.getElementById('newTaskTitle').focus(); 
    }
    
    function closeModal() {
      document.getElementById('addModal').classList.remove('active');
      document.getElementById('editingTaskId').value = '';
    }

    // Drag and Drop Logic
    let draggedCard = null;

    function handleDragStart(e) {
      draggedCard = this;
      setTimeout(() => this.classList.add('dragging'), 0);
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', this.id);
    }

    async function handleDragEnd(e) {
      this.classList.remove('dragging');
      const newColId = this.parentElement.id;
      const id = this.id;
      
      const task = tasksData.find(t => t.id === id);
      if (task && task.col_id !== newColId) {
        task.col_id = newColId;
        // Si sale de en-progreso, limpiar el estado ':working'
        if (newColId !== 'in-progress' && task.tag_class && task.tag_class.includes(':working')) {
          task.tag_class = task.tag_class.replace(':working', '');
        }
        renderBoard();
        try {
          const res = await fetch(`${SUPABASE_URL}?id=eq.${id}`, {
            method: 'PATCH',
            headers: HEADERS,
            body: JSON.stringify({ col_id: newColId, tag_class: task.tag_class })
          });
          if (!res.ok) throw new Error("HTTP " + res.status + " " + await res.text());
        } catch (e) {
          alert("Error al guardar posición: " + e.message);
          console.error("No se pudo guardar la posición en el servidor");
        }
      }
      draggedCard = null;
    }

    document.querySelectorAll('.dropzone').forEach(zone => {
      zone.addEventListener('dragover', e => {
        e.preventDefault();
        const afterElement = getDragAfterElement(zone, e.clientY);
        if (draggedCard) {
          if (afterElement == null) {
            zone.appendChild(draggedCard);
          } else {
            zone.insertBefore(draggedCard, afterElement);
          }
        }
      });
    });

    function getDragAfterElement(container, y) {
      const draggableElements = [...container.querySelectorAll('.kanban-card:not(.dragging)')];
      return draggableElements.reduce((closest, child) => {
        const box = child.getBoundingClientRect();
        const offset = y - box.top - box.height / 2;
        if (offset < 0 && offset > closest.offset) {
          return { offset: offset, element: child };
        } else {
          return closest;
        }
      }, { offset: Number.NEGATIVE_INFINITY }).element;
    }

    // Inicializar
    loadTasks();
  </script>
</body>
